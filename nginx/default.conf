server {
    listen 80;
    server_name localhost;

    # 1. Gestion des fichiers statiques de Django par Nginx directement
    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    # 2. Redirection de toutes les requêtes d'API vers le Backend Django
    location /api/ {
        proxy_pass http://django_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Redirection de l'interface d'administration Django
    location /admin/ {
        proxy_pass http://django_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Par défaut, tout le reste du trafic va vers le Frontend Next.js
    location / {
        proxy_pass http://nextjs_frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
